<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍳 RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
    </header>

    <!-- Controls Section -->
    <div class="controls">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search recipes or ingredients...">
        </div>

        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">All Recipes</button>
            <button class="filter-btn" data-filter="easy">Easy</button>
            <button class="filter-btn" data-filter="medium">Medium</button>
            <button class="filter-btn" data-filter="hard">Hard</button>
            <button class="filter-btn" data-filter="quick">Quick (< 30m)</button>
                    <button class="filter-btn fav-filter-btn" data-filter="favorites">❤️ Favorites</button>
        </div>

        <div class="sort-group">
            <button class="sort-btn" data-sort="name">Sort by Name</button>
            <button class="sort-btn" data-sort="time">Sort by Time</button>
        </div>

        <!-- Recipe Counter -->
        <p id="recipe-count">Showing 8 recipes</p>
    </div>

    <main>
        <div id="recipe-container">
            <!-- Recipe cards will be rendered here by JavaScript -->
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
